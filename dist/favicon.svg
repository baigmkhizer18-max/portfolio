<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFC" />
      <stop offset="1" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#080B12" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" />
  <text x="32" y="42" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="800" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">KB</text>
</svg>
